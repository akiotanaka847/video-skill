name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        # The frame tests synthesize real clips; ffmpeg is genuinely needed.
        # yt-dlp is not: the download and setup tests stub it out on purpose.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else
            sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - run: pip install pytest
      - run: python -m pytest tests/ -q
